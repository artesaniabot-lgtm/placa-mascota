<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayuda a una mascota</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px 12px; background-color: #f8f9fa; color: #333; margin: 0; }
    .card { background: white; padding: 22px 18px; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 420px; margin: 0 auto; }
    h2 { color: #d9534f; font-size: 19px; line-height: 1.3; margin: 0 0 12px; }

    .estado { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: #eef1f4; color: #555; margin-bottom: 14px; }
    .estado.ok { background: #e6f6ea; color: #1e7b34; }
    .estado.error { background: #fdeaea; color: #b02a2a; }

    .foto { display: none; width: 140px; height: 140px; object-fit: cover; border-radius: 50%; border: 4px solid #d9534f; margin: 4px auto 8px; }
    .nombre { font-size: 26px; margin: 4px 0 14px; color: #222; word-break: break-word; }

    .btn { color: white; padding: 14px 20px; border-radius: 8px; font-size: 17px; font-weight: bold; text-decoration: none; display: block; margin-top: 10px; }
    .btn-call { background-color: #0275d8; }
    .btn-wa { background-color: #25D366; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; text-align: left; }
    .item { background: #f4f6f8; border-radius: 10px; padding: 10px 12px; }
    .item .etq { font-size: 12px; color: #777; display: block; margin-bottom: 3px; }
    .item .val { font-size: 16px; font-weight: bold; color: #222; word-break: break-word; }

    .obs { margin-top: 12px; border-radius: 10px; padding: 12px 14px; text-align: left; background: #f4f6f8; }
    .obs .etq { font-size: 12px; color: #777; display: block; margin-bottom: 3px; }
    .obs .val { font-size: 16px; color: #555; word-break: break-word; }
    .obs.alerta { background: #fff4cc; border: 1px solid #f0c33c; }
    .obs.alerta .etq { color: #8a6a00; font-weight: bold; }
    .obs.alerta .val { color: #3d3000; font-weight: bold; }

    .nota { font-size: 12px; color: #888; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="titulo">🐾 ¡Has escaneado la placa de una mascota!</h2>
    <div id="estado" class="estado">Procesando información y avisando al dueño...</div>

    <div id="details" style="display:none;">
      <img id="foto" class="foto" alt="">
      <h1 id="nombre" class="nombre"></h1>

      <a id="callBtn" class="btn btn-call" href="#">📞 Llamar al Dueño</a>
      <a id="waBtn" class="btn btn-wa" href="#" target="_blank" rel="noopener">💬 Escribir por WhatsApp</a>

      <div class="grid">
        <div class="item"><span class="etq">🐾 Raza</span><span class="val" id="raza"></span></div>
        <div class="item"><span class="etq">🎂 Edad</span><span class="val" id="edad"></span></div>
        <div class="item"><span class="etq" id="sexoEtq">🐾 Sexo</span><span class="val" id="sexo"></span></div>
        <div class="item"><span class="etq">👤 Dueño / Tutor</span><span class="val" id="ownerName"></span></div>
      </div>

      <div id="obsBox" class="obs">
        <span class="etq" id="obsEtq">📝 Observaciones</span>
        <span class="val" id="observaciones"></span>
      </div>
    </div>

    <p class="nota">Si el navegador te lo pide, permite la ubicación para que el dueño sepa dónde está su mascota.</p>
  </div>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycby95R7QhQqbWJ8iPe7AzeeA_PrP6LWeLLqD9ZI773IvxPe782JfV0tIhCBQb9wOiz8n/exec";
    var EXTENSIONES = ["jpg", "jpeg", "png", "JPG", "JPEG", "PNG"];

    var estado = document.getElementById("estado");
    var petId = new URLSearchParams(window.location.search).get("id");

    function setEstado(texto, clase) {
      estado.textContent = texto;
      estado.className = "estado" + (clase ? " " + clase : "");
    }

    function mostrarFoto(nombre) {
      var img = document.getElementById("foto");
      var intento = 0;

      function probarSiguiente() {
        if (intento >= EXTENSIONES.length) {
          img.style.display = "none";
          return;
        }
        img.src = "fotos/" + encodeURIComponent(petId) + "." + EXTENSIONES[intento];
        intento++;
      }

      img.onload = function () { img.style.display = "block"; };
      img.onerror = probarSiguiente;
      img.alt = "Foto de " + nombre;
      probarSiguiente();
    }

    function emojiSexo(sexo) {
      var s = (sexo || "").toLowerCase().trim();
      if (s.indexOf("hembra") === 0 || s === "h") { return "♀️"; }
      if (s.indexOf("macho") === 0 || s === "m") { return "♂️"; }
      return "🐾";
    }

    function mostrar(d) {
      document.getElementById("titulo").textContent = "🐾 ¡Has escaneado la placa de " + d.petName + "!";
      document.getElementById("nombre").textContent = d.petName;

      document.getElementById("raza").textContent = d.raza || "No indicada";
      document.getElementById("edad").textContent = d.edad || "No indicada";
      document.getElementById("sexo").textContent = d.sexo || "No indicado";
      document.getElementById("sexoEtq").textContent = emojiSexo(d.sexo) + " Sexo";
      document.getElementById("ownerName").textContent = d.ownerName;

      var obs = (d.observaciones || "").trim();
      var sinObs = (obs === "" || /^ninguna\.?$/i.test(obs));
      document.getElementById("observaciones").textContent = sinObs ? "Ninguna" : obs;
      document.getElementById("obsEtq").textContent = sinObs ? "📝 Observaciones" : "⚠️ Observaciones importantes";
      document.getElementById("obsBox").className = "obs" + (sinObs ? "" : " alerta");

      document.getElementById("callBtn").href = "tel:+" + d.phone;

      var msg = "¡Hola! 🐾 Escaneé la placa de " + d.petName + " y quiero ayudar. ¿Cómo puedo hacer para que vuelva contigo?";
      document.getElementById("waBtn").href =
        "https://wa.me/" + d.phone + "?text=" + encodeURIComponent(msg);

      mostrarFoto(d.petName);
      document.getElementById("details").style.display = "block";
    }

    function notificar(lat, lng) {
      var url = API_URL + "?id=" + encodeURIComponent(petId);
      if (lat !== null && lng !== null) {
        url += "&lat=" + encodeURIComponent(lat) + "&lng=" + encodeURIComponent(lng);
      }
      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.ok && res.data) {
            setEstado("✅ ¡Notificación enviada con éxito! Gracias por ayudar.", "ok");
            mostrar(res.data);
          } else {
            setEstado("No se encontró información para esta placa.", "error");
          }
        })
        .catch(function () {
          setEstado("No se pudo cargar la información. Inténtalo de nuevo.", "error");
        });
    }

    if (!petId) {
      setEstado("Código QR inválido: falta el ID de la mascota.", "error");
    } else if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (pos) { notificar(pos.coords.latitude, pos.coords.longitude); },
        function () { notificar(null, null); },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    } else {
      notificar(null, null);
    }
  </script>
</body>
</html>
